services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intuition
      POSTGRES_PASSWORD: intuition
      POSTGRES_DB: intuition
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intuition"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://intuition:intuition@db:5432/intuition?sslmode=disable
      SERVER_SECRET: ${SERVER_SECRET:-change-me-in-production}
      DAILY_TIMEZONE: ${DAILY_TIMEZONE:-Asia/Kolkata}
    ports: ["8080:8080"]
volumes:
  pgdata:
